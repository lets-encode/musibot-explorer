[project]
name = "musibot-exploration"
version = "0.0.0"
description = "Exploration scripts for the Musibot OMR service (HTTP API and Python client)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pillow>=10",
    "verovio>=5",
    "musibot-core",
    "musibot-client",
    "flask>=3.1.3",
]

# Neither musibot package is on PyPI; both install from the tagged monorepo.
[tool.uv.sources]
musibot-core = { git = "https://github.com/OmniOMR/musibot.git", tag = "core/v0.3.0", subdirectory = "components/core" }
musibot-client = { git = "https://github.com/OmniOMR/musibot.git", tag = "python-client/v0.3.0", subdirectory = "components/python-client" }
